workshop_descriptions:
  adults: 'The Powerful Tools for Caregivers class series helps caregivers take better care of themselves while providing for a friend or relative. By taking care of your own health and well-being, you become a better caregiver. Six class sessions held once a week are led by experienced class leaders. Participants are given a copy of the Powerful Tools for Caregivers Workbook as a companion guide and to provide additional caregiver resources.'
  children: 'The Powerful Tools for Caregivers class series helps caregivers take better care of themselves while providing for a friend or relative. By taking care of your own health and well-being, you become a better caregiver. Six class sessions held once a week are led by experienced class leaders. Participants are given a copy of the Powerful Tools for Caregivers Workbook as a companion guide and to provide additional caregiver resources.'
  stress: 'Caregiving for a family member or friend can be stressful—physically, emotionally, and financially. Join a ‘Managing Stress’ workshop to learn about self-care strategies and techniques to increase relaxation and reduce stress.'
